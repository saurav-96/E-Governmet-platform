<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Safety - AI Government Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0F172A',
                        card: '#1E293B',
                        borderco: '#334155',
                        primary: '#3B82F6',
                        success: '#22C55E',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        text: '#FFFFFF',
                        muted: '#94A3B8'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js and React-Chartjs-2 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: white; margin: 0; }
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Main Dashboard Application
        function Dashboard() {
            // Mock Data
            const recentAlerts = [
                { time: '2 mins ago', type: 'danger', message: 'Accident detected on Highway 4' },
                { time: '15 mins ago', type: 'warning', message: 'Speed limit exceeded in Zone 12' },
                { time: '1 hour ago', type: 'primary', message: 'Signal malfunction at Main St Intersection' }
            ];

            const recommendations = [
                { title: 'Increase Patrols', text: 'Deploy additional patrol units near Sector 7 due to high incident probability.', confidence: 92, priority: 'High' },
                { title: 'Optimize Signals', text: 'Optimize traffic signal timing during rush hours to reduce congestion bottlenecks by 14%.', confidence: 85, priority: 'Medium' }
            ];
            
            const tableData = [
                { id: 'INC-2041', loc: 'Highway 4 North', severity: 'Critical', status: 'Pending', date: 'Oct 24, 2026', action: 'Dispatch' },
                { id: 'INC-2042', loc: 'Downtown Blvd', severity: 'Minor', status: 'Resolved', date: 'Oct 24, 2026', action: 'View' },
                { id: 'INC-2043', loc: 'Sector 7 Xing', severity: 'Major', status: 'Pending', date: 'Oct 23, 2026', action: 'Analyze' },
            ];

            // Render Chart.js graphs post mount
            React.useEffect(() => {
                const lineCtx = document.getElementById('lineChart').getContext('2d');
                new Chart(lineCtx, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{ label: 'Weekly Incidents', data: [12, 19, 15, 25, 22, 30, 28], borderColor: '#3B82F6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, fill: true, tension: 0.4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#334155'}, ticks: { color: '#94A3B8'} }, x: { grid: { display: false}, ticks: { color: '#94A3B8'} } } }
                });

                const pieCtx = document.getElementById('pieChart').getContext('2d');
                new Chart(pieCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Speeding', 'Drunk Driving', 'Helmet Violations', 'Parking'],
                        datasets: [{ data: [45, 20, 25, 10], backgroundColor: ['#3B82F6', '#EF4444', '#F59E0B', '#22C55E'], borderWidth: 0, hoverOffset: 4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94A3B8' } } }, cutout: '70%' }
                });
            }, []);

            return (
                <div className="flex h-screen overflow-hidden">
                    
                    {/* Sidebar */}
                    <aside className="w-64 bg-[#111827] border-r border-[#334155] flex flex-col hidden md:flex h-full">
                        <div className="p-6">
                            <h2 className="text-xl font-bold flex items-center gap-2 text-white">
                                <i className="fas fa-shield-alt text-primary"></i> SmartGov AI
                            </h2>
                        </div>
                        <nav className="flex-1 px-4 space-y-2 mt-4">
                            <a href="#" className="flex items-center gap-3 px-4 py-3 text-muted hover:text-white rounded-xl transition duration-200">
                                <i className="fas fa-home"></i> Dashboard
                            </a>
                            <a href="index.html" className="flex items-center gap-3 px-4 py-3 text-muted hover:text-white rounded-xl transition duration-200">
                                <i className="fas fa-building"></i> Departments
                            </a>
                            <a href="#" className="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-[0_4px_15px_rgba(59,130,246,0.3)] transition duration-200">
                                <i className="fas fa-traffic-light"></i> Traffic Safety
                            </a>
                            <a href="#" className="flex items-center gap-3 px-4 py-3 text-muted hover:text-white rounded-xl transition duration-200">
                                <i className="fas fa-users"></i> Citizens
                            </a>
                            <a href="#" className="flex items-center gap-3 px-4 py-3 text-muted hover:text-white rounded-xl transition duration-200">
                                <i className="fas fa-chart-pie"></i> Analytics
                            </a>
                        </nav>
                        <div className="p-4 mt-auto">
                            <div className="bg-card p-4 rounded-xl border border-borderco text-sm">
                                <div className="text-muted mb-2">AI Systems</div>
                                <div className="flex justify-between items-center text-success">
                                    <span>Status</span> <span className="font-bold">Online</span>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full bg-[#0F172A] overflow-y-auto">
                        
                        {/* Header */}
                        <header className="h-[70px] bg-[#0F172A]/90 backdrop-blur-md border-b border-[#334155] flex items-center justify-between px-8 sticky top-0 z-10 transition-colors">
                            <div className="text-sm font-medium text-muted">
                                Departments <span className="mx-2">&gt;</span> <span className="text-primary">Traffic Safety</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="relative">
                                    <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
                                    <input type="text" placeholder="Search..." className="bg-card border border-borderco rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-primary transition"/>
                                </div>
                                <button className="relative text-muted hover:text-white transition">
                                    <i className="far fa-bell text-xl"></i>
                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-danger rounded-full border-2 border-[#0F172A]"></span>
                                </button>
                                <div className="w-9 h-9 rounded-full bg-cover bg-center border border-borderco" style={{backgroundImage: "url('https://ui-avatars.com/api/?name=Admin+Gov&background=3B82F6&color=fff')"}}></div>
                            </div>
                        </header>

                        {/* Page Content */}
                        <div className="p-8 space-y-6">
                            
                            {/* Page Title */}
                            <div>
                                <h1 className="text-[36px] font-bold text-white mb-2 leading-tight">Traffic Safety Department</h1>
                                <p className="text-[16px] text-muted">AI-powered monitoring and analytics for road safety management.</p>
                            </div>

                            {/* Stat Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                {[
                                    { title: 'Total Incidents', val: '1,284', icon: 'fa-exclamation-triangle', color: 'text-danger' },
                                    { title: 'Resolved Cases', val: '956', icon: 'fa-check-circle', color: 'text-success' },
                                    { title: 'Monitoring Zones', val: '142', icon: 'fa-video', color: 'text-primary' },
                                    { title: 'Response Time', val: '4.2 min', icon: 'fa-clock', color: 'text-warning' }
                                ].map((stat, i) => (
                                    <div key={i} className="bg-card rounded-[20px] p-6 shadow-lg border border-borderco hover:-translate-y-1 hover:shadow-[0_8px_30px_rgba(0,0,0,0.25)] transition duration-300">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="text-muted text-sm font-medium mb-1">{stat.title}</p>
                                                <h3 className="text-[32px] font-bold text-white">{stat.val}</h3>
                                            </div>
                                            <div className={`w-12 h-12 rounded-2xl bg-[#0F172A] flex items-center justify-center ${stat.color} text-xl`}>
                                                <i className={`fas ${stat.icon}`}></i>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Analytics Row */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="bg-card rounded-[20px] p-6 border border-borderco shadow-lg">
                                    <h2 className="text-[20px] font-bold text-white mb-4">Incident Trends</h2>
                                    <div className="h-64"><canvas id="lineChart"></canvas></div>
                                </div>
                                <div className="bg-card rounded-[20px] p-6 border border-borderco shadow-lg">
                                    <h2 className="text-[20px] font-bold text-white mb-4">Violations Breakdown</h2>
                                    <div className="h-64"><canvas id="pieChart"></canvas></div>
                                </div>
                            </div>

                            {/* Bottom Grid: Table & AI/Alerts */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                
                                {/* Incident Table */}
                                <div className="lg:col-span-2 bg-card rounded-[20px] p-6 border border-borderco shadow-lg overflow-x-auto">
                                    <h2 className="text-[20px] font-bold text-white mb-4">Recent Traffic Incidents</h2>
                                    <table className="w-full text-left text-sm whitespace-nowrap">
                                        <thead>
                                            <tr className="text-muted border-b border-borderco">
                                                <th className="pb-3 px-4 font-medium">Incident ID</th>
                                                <th className="pb-3 px-4 font-medium">Location</th>
                                                <th className="pb-3 px-4 font-medium">Severity</th>
                                                <th className="pb-3 px-4 font-medium">Status</th>
                                                <th className="pb-3 px-4 font-medium">Date</th>
                                                <th className="pb-3 px-4 font-medium">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableData.map((row, i) => (
                                                <tr key={i} className="border-b border-borderco/50 hover:bg-[#0F172A] transition">
                                                    <td className="py-4 px-4 font-medium text-white">{row.id}</td>
                                                    <td className="py-4 px-4 text-muted">{row.loc}</td>
                                                    <td className="py-4 px-4">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${row.severity === 'Critical' ? 'bg-danger/20 text-danger' : row.severity === 'Major' ? 'bg-warning/20 text-warning' : 'bg-primary/20 text-primary'}`}>
                                                            {row.severity}
                                                        </span>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="flex items-center gap-2">
                                                            <div className={`w-2 h-2 rounded-full ${row.status === 'Resolved' ? 'bg-success' : 'bg-warning'}`}></div>
                                                            <span className="text-muted">{row.status}</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-4 text-muted">{row.date}</td>
                                                    <td className="py-4 px-4">
                                                        <button className="text-primary hover:text-white font-medium bg-[#0F172A] px-3 py-1.5 rounded-lg border border-borderco hover:border-primary transition">
                                                            {row.action}
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Right Panel: AI & Alerts */}
                                <div className="space-y-6">
                                    
                                    {/* AI Recommendations */}
                                    <div className="bg-card rounded-[20px] p-6 border border-borderco shadow-lg relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
                                        <h2 className="text-[20px] font-bold text-white mb-4 flex items-center gap-2">
                                            <i className="fas fa-robot text-primary"></i> AI Recommendations
                                        </h2>
                                        <div className="space-y-4 relative z-10">
                                            {recommendations.map(rec => (
                                                <div key={rec.title} className="p-4 bg-[#0F172A] rounded-xl border border-borderco">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-white font-semibold text-sm">{rec.title}</span>
                                                        <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${rec.priority === 'High' ? 'bg-danger/20 text-danger' : 'bg-warning/20 text-warning'}`}>{rec.priority}</span>
                                                    </div>
                                                    <p className="text-muted text-xs leading-relaxed mb-3">{rec.text}</p>
                                                    <div className="flex justify-between items-center text-xs">
                                                        <span className="flex items-center gap-1 text-primary"><i className="fas fa-brain"></i> {rec.confidence}% Confidence</span>
                                                        <button className="text-white hover:text-primary transition underline decoration-borderco underline-offset-2">Apply</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Recent Alerts Timeline */}
                                    <div className="bg-card rounded-[20px] p-6 border border-borderco shadow-lg">
                                        <h2 className="text-[20px] font-bold text-white mb-6">Recent Alerts</h2>
                                        <div className="relative pl-6 space-y-6 border-l border-borderco ml-2">
                                            {recentAlerts.map((alert, i) => (
                                                <div key={i} className="relative">
                                                    <div className={`absolute -left-[31px] top-1 w-3.5 h-3.5 rounded-full border-2 border-card ${alert.type === 'danger' ? 'bg-danger' : alert.type === 'warning' ? 'bg-warning' : 'bg-primary'}`}></div>
                                                    <p className="text-xs text-muted font-medium mb-1">{alert.time}</p>
                                                    <p className="text-sm text-white">{alert.message}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                            
                            {/* Footer */}
                            <footer className="pt-8 pb-4 text-center text-xs text-muted flex justify-center items-center gap-2">
                                Powered by Engine AI <i className="fas fa-bolt text-primary opacity-50"></i> SmartGov 2026
                            </footer>

                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
